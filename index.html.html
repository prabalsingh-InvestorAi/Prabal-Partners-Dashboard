<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prabal & Partners × InvestorAi | Monthly Business Update</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --purple:      #7B5EA7;
    --purple-dark: #5B4080;
    --purple-mid:  #9B7DC8;
    --purple-soft: #F5F2FA;
    --purple-pale: #FDFBFF;
    --purple-glow: rgba(91,45,142,0.10);
    --white:       #FFFFFF;
    --bg:          #FFFFFF;
    --ink:         #1A1A1A;
    --ink-mid:     #333333;
    --ink-muted:   #666666;
    --rule:        #E8E8E8;
    --rule-soft:   #F5F5F5;
    --red:         #D93030;
    --red-bg:      #FEF0F0;
    --amber:       #C47A1A;
    --amber-bg:    #FEF5E7;
    --green:       #1A7A4B;
    --green-bg:    #E8F5EE;
    --blue:        #1A5BAA;
    --coral:       #E8462A;
    --coral-soft:  #FFF0ED;
    --coral-mid:   rgba(232,70,42,0.12);
    --blue-bg:     #EBF2FC;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; overflow-x: hidden; }

  body {
    background: var(--bg);
    font-family: 'Manrope', sans-serif;
    color: var(--ink);
    font-size: 13px;
    line-height: 1.5;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .page { width: 100%; margin: 0; }

  /* ── HEADER ── */
  .header {
    background: #FFFFFF;
    padding: 18px 2% 16px;
    border-bottom: 3px solid var(--coral);
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 24px;
    border-bottom: 3px solid var(--purple-mid);
  }

  .logo-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    background: transparent;
    padding: 6px 0;
    border-radius: 6px;
  }

  .logo-wrap img {
    height: 28px;
    width: auto;
    display: block;
    object-fit: contain;
  }

  /* Fallback text logo if image fails */
  .logo-text {
    font-size: 16px;
    font-weight: 800;
    color: var(--purple-dark);
    letter-spacing: -0.02em;
    display: none;
  }

  .logo-divider {
    width: 1px;
    height: 22px;
    background: #CCCCCC;
  }

  .logo-partner {
    font-size: 11px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: 0.06em;
  }

  .header-center {
    text-align: center;
  }

  .header-center .title {
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: 0.04em;
  }

  .header-center .sub {
    font-size: 10px;
    color: var(--ink-muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 2px;
  }

  .header-meta {
    text-align: right;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .header-meta .date {
    font-size: 17px;
    font-weight: 800;
    color: var(--coral);
    letter-spacing: -0.01em;
  }

  .header-meta .conf {
    font-size: 10px;
    color: var(--ink-muted);
    letter-spacing: 0.06em;
  }

  /* ── TICKER ── */
  .ticker {
    background: #C73820;
    padding: 8px 2%;
    display: flex;
    align-items: center;
    gap: 0;
    flex-wrap: nowrap;
    overflow: hidden;
    width: 100%;
  }

  .ti {
    display: flex;
    align-items: center;
    gap: 6px;
    padding-right: 0;
    margin-right: 0;
    border-right: 1px solid rgba(255,255,255,0.15);
    white-space: nowrap;
    flex: 1;
    justify-content: center;
    padding: 0 12px;
  }
  .ti:first-child { padding-left: 0; }
  .ti:last-child { border-right: none; padding-right: 0; }

  .ti:last-child { border-right: none; padding-right: 0; margin-right: 0; }

  .ti-lbl {
    font-size: 9px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: rgba(255,255,255,0.55);
  }

  .ti-val {
    font-size: 11.5px;
    font-weight: 800;
    color: #fff;
  }

  .ti-val.warn { color: #FF7B7B; }
  .ti-val.ok   { color: #7DE8C8; }

  /* ── SECTION LABEL ── */
  .sec {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 2% 8px;
  }

  .sec-text {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--coral);
    white-space: nowrap;
  }

  .sec-rule {
    flex: 1;
    height: 1px;
    background: var(--rule);
  }

  /* ── GRID ── */
  .grid {
    display: grid;
    gap: 1px;
    background: var(--rule);
    margin: 0 2%;
    border-radius: 8px;
    overflow: hidden;
  }

  .g3 { grid-template-columns: 1fr 1fr 1fr; }
  .g4 { grid-template-columns: repeat(4,1fr); }
  .g5 { grid-template-columns: repeat(5,1fr); }

  .cell {
    background: var(--white);
    padding: 16px 18px;
  }

  .cell.purple-cell {
    background: var(--coral);
    color: #fff;
  }

  /* ── CELL HEADER ── */
  .ch {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding: 8px 10px;
    margin: -16px -18px 12px -18px;
    background: var(--coral-soft);
    border-bottom: 2px solid var(--coral);
    border-radius: 0;
  }

  .ch-title {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--ink-muted);
  }

  /* ── BADGE ── */
  .badge {
    display: inline-flex;
    align-items: center;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 4px;
  }

  .b-red    { background: var(--red-bg);   color: var(--red); }
  .b-amber  { background: var(--amber-bg); color: var(--amber); }
  .b-green  { background: var(--green-bg); color: var(--green); }
  .b-blue   { background: var(--blue-bg);  color: var(--blue); }
  .b-purple { background: var(--coral-soft); color: var(--coral); }

  /* ── KPI ── */
  .kpi-lbl {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--ink-muted);
    margin-bottom: 5px;
  }

  .kpi-val {
    font-size: 26px;
    font-weight: 800;
    line-height: 1;
    color: var(--ink);
    letter-spacing: -0.02em;
  }

  .kpi-val.purple { color: var(--coral); }
  .kpi-val.red    { color: var(--red); }
  .kpi-val.green  { color: var(--green); }

  .kpi-sub {
    font-size: 11px;
    color: var(--ink-muted);
    margin-top: 4px;
  }

  /* ── RING ── */
  .ach-cell {
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .ach-rows {
    flex: 1;
    min-width: 0;
    padding-top: 4px;
  }

  .ring-wrap {
    position: relative;
    width: 90px;
    height: 90px;
    min-width: 90px;
    flex-shrink: 0;
    align-self: center;
  }

  .ring-inner {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    pointer-events: none;
    z-index: 2;
    width: 90px;
  }

  .ring-pct {
    font-size: 17px;
    font-weight: 800;
    color: var(--red);
    line-height: 1;
    display: block;
    width: 100%;
    text-align: center;
  }

  .ring-lbl {
    font-size: 9px;
    color: var(--ink-muted);
    font-weight: 600;
    letter-spacing: 0.06em;
    display: block;
    width: 100%;
    text-align: center;
  }

  .ach-rows { flex: 1; }

  .ach-row {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    border-bottom: 1px solid var(--rule);
    gap: 8px;
  }

  .ach-row:last-child { border-bottom: none; }
  .ar-lbl { font-size: 11px; color: var(--ink-muted); min-width: 140px; white-space: nowrap; }
  .ar-val { font-size: 12px; font-weight: 700; color: var(--ink); }
  .ar-val.red { color: var(--red); }

  /* ── MINI STAT ROW ── */
  .stat-row {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 0;
    border-top: 1px solid var(--rule);
    margin-top: 10px;
  }

  .stat-box {
    flex: 1;
    padding: 8px 10px 6px;
    border-right: 1px solid var(--rule);
    text-align: center;
  }

  .stat-box:last-child { border-right: none; }

  .stat-box .sv {
    font-size: 15px;
    font-weight: 800;
    color: var(--coral);
    display: block;
  }

  .stat-box .sl {
    font-size: 9.5px;
    color: var(--ink-muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.07em;
  }

  /* ── RECAP GRID ── */
  .recap-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }

  .recap-item {
    background: #FAFAFA;
    border-radius: 5px;
    padding: 8px 10px;
    border: 1px solid var(--rule-soft);
  }

  .recap-partner {
    font-size: 9.5px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--ink-muted);
    margin-bottom: 3px;
  }

  .recap-val {
    font-size: 16px;
    font-weight: 800;
    color: var(--coral);
  }

  .recap-sub {
    font-size: 10px;
    color: var(--ink-muted);
    margin-top: 1px;
  }

  /* ── PARTNER TABLE ── */
  .ptable { width: 100%; border-collapse: collapse; font-size: 11.5px; }

  .ptable thead th {
    background: var(--coral);
    color: rgba(255,255,255,0.8);
    padding: 9px 12px;
    text-align: left;
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .ptable thead th:not(:first-child) { text-align: right; }

  .ptable tbody td {
    padding: 8px 12px;
    border-bottom: 1px solid var(--rule);
    vertical-align: middle;
    background: var(--white);
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
  }

  .ptable tbody td:not(:first-child) { text-align: right; }
  .ptable tbody tr:last-child td { border-bottom: none; }
  .ptable tbody tr:hover td { background: #FAFAFA; }

  .pname { font-weight: 700; font-size: 12px; color: var(--ink); }
  .pprod { font-size: 10px; color: var(--ink-muted); margin-top: 1px; }

  /* ── PROGRESS BAR ── */
  .pbar-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    justify-content: flex-end;
  }

  .pbar {
    width: 55px;
    height: 4px;
    background: var(--rule);
    border-radius: 2px;
    overflow: hidden;
  }

  .pbar-fill { height: 100%; border-radius: 2px; }
  .pf-red   { background: var(--red); }
  .pf-amber { background: var(--amber); }
  .pf-green { background: var(--green); }
  .pf-purple { background: #C73820; }

  /* ── PIPELINE ── */
  .pipe-item {
    background: var(--white);
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .pipe-partner {
    font-size: 9.5px;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }

  .pipe-amt {
    font-size: 22px;
    font-weight: 800;
    color: var(--coral);
    line-height: 1;
    letter-spacing: -0.02em;
  }

  .pipe-type {
    font-size: 10px;
    color: var(--ink-muted);
    line-height: 1.5;
    flex: 1;
  }

  /* ── HIGHLIGHT LIST ── */
  .hl-list { display: flex; flex-direction: column; gap: 0; }

  .hl-item {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 7px 0;
    border-bottom: 1px solid var(--rule);
  }

  .hl-item:last-child { border-bottom: none; }

  .hl-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    margin-top: 5px;
    flex-shrink: 0;
  }

  .d-red    { background: var(--red); }
  .d-amber  { background: var(--amber); }
  .d-purple { background: #C73820; }
  .d-blue   { background: var(--blue); }
  .d-green  { background: var(--green); }

  .hl-text { font-size: 11.5px; color: var(--ink-mid); line-height: 1.55; }
  .hl-text strong { font-weight: 700; color: var(--ink); }

  /* ── VIS BAR ── */
  .vis-bar-wrap { display: flex; align-items: center; gap: 8px; margin-top: 8px; }

  .vis-bar {
    flex: 1;
    height: 5px;
    background: var(--rule);
    border-radius: 3px;
    overflow: hidden;
  }

  .vis-fill { height: 100%; background: #C73820; border-radius: 3px; }
  .vis-label { font-size: 10px; color: var(--ink-muted); white-space: nowrap; }

  /* ── FOOTER ── */
  .footer {
    background: #FFFFFF;
    border-top: 2px solid var(--coral);
    padding: 10px 2%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10px;
    color: var(--ink-muted);
    letter-spacing: 0.06em;
  }

  .footer span.highlight { color: var(--coral); font-weight: 700; }

  /* ── PAGE BREAK ── */
  .page-break {
    border: none;
    border-top: 3px solid var(--rule);
    margin: 0;
  }

  @media print {
    body { background: #fff !important; }
    .page-break { page-break-after: always; border: none; }
    @page { size: A4 landscape; margin: 0; }
  }

  /* ── PURPLE ACCENT BORDER ── */
  .accent-left { border-left: 3px solid var(--coral); }

  /* ══════════════ RESPONSIVE — MOBILE ══════════════ */

    /* Larger base font on mobile */
    body { font-size: 15px; }
    .hl-text { font-size: 14px !important; line-height: 1.6 !important; }
    .ar-lbl { font-size: 13px !important; }
    .ar-val { font-size: 14px !important; }
    .kpi-val { font-size: 26px !important; }
    .kpi-sub { font-size: 13px !important; }
    .ch-title { font-size: 11px !important; }
    .badge { font-size: 10px !important; padding: 3px 8px !important; }
    .pname { font-size: 14px !important; }
    .pprod { font-size: 12px !important; }
    .ring-pct { font-size: 20px !important; }
    .ring-lbl { font-size: 11px !important; }
    .sec-text { font-size: 12px !important; }
    .pipe-partner { font-size: 11px !important; }
    .pipe-amt { font-size: 22px !important; }
    .pipe-type { font-size: 12px !important; }
    .stat-box .sv { font-size: 18px !important; }
    .stat-box .sl { font-size: 11px !important; }
    .recap-val { font-size: 18px !important; }
    .recap-sub { font-size: 12px !important; }
    .recap-partner { font-size: 11px !important; }
    .ti-val { font-size: 13px !important; }
    .ti-lbl { font-size: 10px !important; }
    .header-center .title { font-size: 14px !important; }
    .header-meta .date { font-size: 16px !important; }

    /* Header */
    .header {
      grid-template-columns: 1fr;
      gap: 10px;
      padding: 14px 16px 12px;
      text-align: center;
    }
    .logo-wrap { justify-content: center; }
    .header-meta { text-align: center; }
    .header-meta .date { font-size: 14px; }

    /* Ticker — 2 col grid */
    .ticker {
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding: 0;
      gap: 0;
    }
    .ti {
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      padding: 10px 14px !important;
      border-right: none !important;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      justify-content: flex-start;
    }
    .ti:nth-child(odd) { border-right: 1px solid rgba(255,255,255,0.1) !important; }
    .ti-val { font-size: 12px; }
    .ti-lbl { font-size: 9px; }

    /* Section labels */
    .sec { padding: 12px 16px 6px; }

    /* All grids → single column */
    .grid.g3,
    .grid.g4,
    .grid.g5,
    .grid.g2 {
      grid-template-columns: 1fr !important;
      margin: 0 12px;
    }

    /* Cells */
    .cell, .pipe-item {
      padding: 14px 14px;
    }

    /* Achievement ring cell */
    .ach-cell { gap: 12px; }
    .ring-wrap { width: 64px; height: 64px; }
    .ring-pct { font-size: 15px !important; }
    .ring-lbl { font-size: 10px !important; }

    /* KPI values */
    .kpi-val { font-size: 22px; }
    .kpi-val.purple { font-size: 24px; }

    /* Stat row — 4 cols stays as 2x2 */
    .stat-row {
      grid-template-columns: repeat(2, 1fr) !important;
    }

    /* Recap grid stays 2 col — fine on mobile */
    .recap-grid { grid-template-columns: 1fr 1fr; }

    /* Partner table — horizontal scroll */
    .ptable-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin: 0 12px;
      border-radius: 8px;
      border: 1px solid var(--rule);
    }
    .ptable { min-width: 700px; }

    /* Pipeline items */
    .pipe-item { border-left: none !important; border-top: 3px solid var(--purple); }

    /* Page 2 mini header */
    .p2-header {
      flex-direction: column;
      gap: 6px;
      padding: 10px 16px;
      text-align: center;
    }

    /* Risks grid already single col */

    /* Footer */
    .footer {
      flex-direction: column;
      gap: 4px;
      text-align: center;
      padding: 12px 16px;
    }

    /* Page break spacer */
    .page-break-spacer { height: 12px; }

    /* Action card numbered items */
    .hl-item { gap: 8px; }
  }

  @media (max-width: 480px) {
    .header-center .title { font-size: 12px; }
    .logo-wrap img { height: 24px; }
    .kpi-val { font-size: 20px; }
    .recap-grid { grid-template-columns: 1fr; }
  }


  @media (max-width: 768px) {
    .ptable-wrap {
      margin: 0 12px !important;
      border-radius: 8px !important;
      overflow-x: scroll !important;
      -webkit-overflow-scrolling: touch !important;
      display: block !important;
      width: calc(100% - 24px) !important;
    }
    .ptable {
      min-width: 680px !important;
      width: 680px !important;
    }
    .ptable thead th,
    .ptable tbody td {
      padding: 8px 10px !important;
      font-size: 11px !important;
    }
    .pbar-wrap { gap: 4px; }
    .pbar { width: 36px !important; }
    /* scroll hint shadow */
    .ptable-wrap::after {
      content: '← scroll →';
      display: block;
      text-align: center;
      font-size: 10px;
      color: var(--ink-muted);
      padding: 6px;
      background: #FAFAFA;
      letter-spacing: 0.08em;
    }
  }

</style>
</head>

</div>

// ── Ring SVG ──
function ringHTML(pct, status) {
  const C = 194.8;
  const filled = C * (pct / 100);
  const offset = C - filled;
  const isGood = pct >= 50;
  const color = status === 'critical' ? '#D93030' : pct >= 80 ? '#00C4A0' : pct >= 40 ? '#C47A1A' : '#D93030';
  const textColor = color;
  return `
    <div class="ring-wrap">
      <svg width="90" height="90" viewBox="0 0 90 90" style="display:block;">
        <circle cx="45" cy="45" r="36" fill="none" stroke="#F0EEF8" stroke-width="8"/>
        <circle cx="45" cy="45" r="36" fill="none" stroke="${color}" stroke-width="8"
          stroke-dasharray="226.2" stroke-dashoffset="${(226.2 - 226.2 * pct / 100).toFixed(1)}"
          stroke-linecap="round" transform="rotate(-90 45 45)"/>
        <text x="45" y="41" text-anchor="middle" dominant-baseline="middle"
          font-family="Manrope,sans-serif" font-size="16" font-weight="800" fill="${color}">${pct}%</text>
        <text x="45" y="57" text-anchor="middle" dominant-baseline="middle"
          font-family="Manrope,sans-serif" font-size="10" font-weight="600" fill="#7A7A9A">done</text>
      </svg>
    </div>`;
}

  const MA = D.month_actuals;
  const achColor = MA.status === 'critical' ? 'var(--red)' : MA.achievement_pct >= 80 ? 'var(--green)' : 'var(--amber)';
  const achBadge = MA.status === 'critical'
    ? `<span class="badge b-red">Critical</span>`
    : MA.achievement_pct >= 80
    ? `<span class="badge b-green">On Track</span>`
    : `<span class="badge b-amber">Improving</span>`;

  // Visibility share stat boxes
  const shareBoxes = D.pipeline.partners.map(p =>
    `<div class="stat-box"><span class="sv">${p.share_pct}%</span><span class="sl">${p.name}</span></div>`
  ).join('');

  // FY26 recap cards
  const fy26Cards = D.fy26_recap.partners.map(p => `
    <div class="recap-item">
      <div class="recap-partner">${p.name}</div>
      <div class="recap-val">${num(p.baskets)}</div>
      <div class="recap-sub">${p.revenue_cr < 1 ? `₹${p.revenue_cr} Cr` : `₹${p.revenue_cr} Cr`} · ${p.products}</div>
    </div>`).join('');

  // Partner actuals table rows
  const tableRows = D.partner_actuals.map(p => {
    // Always compute ach_pct from revenue data at render time
    const ach = (p.target_rev_l && p.actual_rev_l)
      ? Math.round((parseFloat(String(p.actual_rev_l).replace('~','')) / p.target_rev_l) * 1000) / 10
      : p.ach_pct;
    const color = ach === null ? 'var(--purple)' : STATUS_COLOR[p.status];
    const barClass = STATUS_BAR[p.status];
    const barW = ach === null ? 2 : Math.min(ach, 100);
    const achLabel = ach === null ? (p.status === 'new' ? 'New' : 'Early') : `${ach}%`;
    return `<tr>
      <td style="padding-left:16px;">
        <div class="pname">${p.partner}</div>
        <div class="pprod">${p.product}</div>
        ${p.note ? `<div style="font-size:10px;color:var(--amber);margin-top:2px;font-style:italic;">⚠ ${p.note}</div>` : ''}
      </td>
      <td style="border-left:2px solid var(--rule);">${p.target_baskets ?? '—'}</td>
      <td>${p.target_rev_l !== null ? `₹${p.target_rev_l}` : '—'}</td>
      <td>${p.actual_baskets ?? '—'}</td>
      <td>${p.actual_rev_l !== null ? `₹${p.actual_rev_l}` : '—'}</td>
      <td>
        <div class="pbar-wrap">
          <span style="font-weight:800;color:${color};font-size:12px;min-width:36px;">${achLabel}</span>
          <div class="pbar"><div class="pbar-fill ${barClass}" style="width:${barW}%"></div></div>
        </div>
      </td>
      <td style="border-left:2px solid var(--rule);"><strong>${num(p.fy27_baskets)}</strong> · ₹${p.fy27_rev}</td>
      <td>
        <div style="font-weight:600;color:var(--ink);font-size:11.5px;">${p.fy27_achieved_baskets ? '<strong>' + num(p.fy27_achieved_baskets) + '</strong> · ₹' + p.fy27_achieved_rev_l + 'L' : p.fy27_achieved_rev_l ? '₹' + p.fy27_achieved_rev_l + 'L' : '—'}</div>
        ${p.fy27_achieved_pct > 0 ? `<div style="margin-top:4px;display:flex;align-items:center;gap:5px;">
          <div style="flex:1;height:4px;background:var(--rule);border-radius:2px;overflow:hidden;">
            <div style="width:${Math.min(p.fy27_achieved_pct,100)}%;height:100%;background:var(--coral);border-radius:2px;"></div>
          </div>
          <span style="font-size:10px;color:var(--ink-muted);white-space:nowrap;">${p.fy27_achieved_pct}%</span>
        </div>` : ''}
      </td>
      <td style="padding-right:16px;">${STATUS_BADGE[p.status]}</td>
    </tr>`;
  }).join('');

  // Pipeline strip
  const pipeItems = D.pipeline.partners.map(p => `
    <div class="pipe-item" style="border-left:3px solid ${PIPE_BORDER[p.status] || 'var(--purple)'};">
      <div class="pipe-partner">${p.name}</div>
      <div class="pipe-amt">₹${p.visibility_cr >= 1 ? p.visibility_cr + ' Cr' : (p.visibility_cr * 100) + ' L'}</div>
      <div class="pipe-type">${p.products}</div>
      <span class="badge ${p.status === 'anchor' ? 'b-purple' : p.status === 'growing' ? 'b-blue' : p.status === 'new' ? 'b-purple' : 'b-amber'}" style="margin-top:6px;align-self:flex-start;">${p.status_label}</span>
    </div>`).join('');

  // Risks
  const riskItems = D.risks.map(r => `
    <div class="hl-item">
      <div class="hl-dot ${DOT_COLOR[r.severity]}"></div>
      <div class="hl-text">${r.text}</div>
    </div>`).join('');

  // Actions
  const actionItems = D.actions.map((a, i) => {
    const subPoints = a.points ? a.points.map((p, j) =>
      `<div style="display:flex;align-items:baseline;gap:6px;margin-top:4px;">
        <span style="font-size:10px;font-weight:700;color:var(--purple);flex-shrink:0;min-width:14px;">${j+1}.</span>
        <span style="font-size:12px;color:var(--ink-mid);line-height:1.5;">${p}</span>
      </div>`
    ).join('') : '';
    const body = a.text || '';
    return `
    <div class="hl-item">
      <div style="background:var(--coral);width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;">
        <span style="font-size:10px;font-weight:800;color:#fff;">${i+1}</span>
      </div>
      <div style="flex:1;">
        <div class="hl-text"><strong>${a.heading || ''}</strong>${body ? ' — ' + body : ''}</div>
        ${subPoints}
      </div>
    </div>`;
  }).join('');

  // Partner highlights
  const hlItems = D.partner_highlights.map(h => `
    <div class="hl-item">
      <div class="hl-dot ${DOT_COLOR[h.severity]}"></div>
      <div class="hl-text">${h.text}</div>
    </div>`).join('');

  // Rupeeseed
  const RS = D.rupeeseed;
  const AC = D.action_card;

  const logoImg = `<img src="${LOGO_SRC}" alt="InvestorAi" style="height:32px;width:auto;display:block;"/>`;
  const logoImgSm = `<img src="${LOGO_SRC}" alt="InvestorAi" style="height:22px;width:auto;display:block;"/>`;

  document.getElementById('dashboard-root').innerHTML = `

  <!-- HEADER -->
  <header class="header">
    <div class="logo-wrap">
      ${logoImg}
      <div class="logo-divider"></div>
      <span class="logo-partner">Prabal &amp; Partners</span>
    </div>
    <div class="header-center">
      <div class="title" style="color:var(--ink);">Monthly Business Update &nbsp;·&nbsp; ${m.fy}<br><span style="font-size:12px;font-weight:500;color:var(--ink-muted);">Month ${m.month_num} of ${m.total_months}</span></div>
      <div class="sub" style="color:var(--ink-muted);">Confidential</div>
    </div>
    <div class="header-meta">
      <span class="date" style="color:var(--coral);">${m.month}</span>
      <span class="conf" style="color:var(--ink-muted);">investorai.in</span>
    </div>
  </header>



  <!-- ROW 1 -->
  <div class="sec"><span class="sec-text">${m.month} — At a Glance</span><div class="sec-rule"></div></div>
  <div class="grid g3" style="grid-template-columns: 1fr 1.6fr 1fr;">

    <!-- Achievement -->
    <div class="cell accent-left">
      <div class="ch">
        <span class="ch-title">Monthly Achievement</span>
        ${achBadge}
      </div>
      <div class="ach-cell">
        ${ringHTML(MA.achievement_pct, MA.status)}
        <div class="ach-rows">
          <div class="ach-row"><span class="ar-lbl">Month Target</span><span class="ar-val">₹${T.month_target_cr} Cr</span></div>
          <div class="ach-row"><span class="ar-lbl">Month Actual</span><span class="ar-val" style="color:${achColor};">₹${MA.revenue_cr} Cr</span></div>
          <div class="ach-row"><span class="ar-lbl">Shortfall</span><span class="ar-val" style="color:${achColor};">₹${MA.shortfall_cr} Cr</span></div>
          <div class="ach-row"><span class="ar-lbl">Baskets</span><span class="ar-val" style="color:${achColor};">${MA.baskets} / ${T.month_target_baskets}</span></div>
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="cell accent-left">
      <div class="ch">
        <div>
          <div style="font-size:13px;font-weight:800;color:var(--purple);letter-spacing:-0.01em;margin-bottom:6px;">${AC.header_label}</div>
          <div style="font-size:13px;font-weight:700;color:var(--ink-mid);margin-bottom:10px;">${AC.header_question}</div>
          <div style="display:flex;align-items:center;gap:6px;">
            <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0;"></span>
            <span class="badge b-green" style="white-space:nowrap;">${D.actions.length} Actions Live</span>
          </div>
        </div>
      </div>
      <div class="hl-list">${actionItems}</div>
    </div>

    <!-- FY27 Visibility -->
    <div class="cell accent-left">
      <div class="ch">
        <span class="ch-title">FY27 Visibility</span>
        <span class="badge b-purple">${Math.round(T.fy27_visibility_cr / T.fy27_annual_target_cr * 100)}% of Target</span>
      </div>
      <div class="kpi-val purple" style="font-size:28px;">₹${T.fy27_visibility_cr} Cr</div>
      <div class="kpi-sub">vs ₹${T.fy27_annual_target_cr} Cr annual target</div>
      <div class="vis-bar-wrap">
        <div class="vis-bar"><div class="vis-fill" style="width:100%"></div></div>
        <span class="vis-label">${num(T.fy27_visibility_baskets)} baskets</span>
      </div>
      <div class="stat-row" style="grid-template-columns:repeat(${D.pipeline.partners.length},1fr);">
        ${shareBoxes}
      </div>
    </div>

  </div>

  <!-- PARTNER TABLE -->
  <div class="sec" style="padding-bottom:4px;"><span class="sec-text">Partner Actuals — ${m.month}</span><div class="sec-rule"></div></div>
  <div class="ptable-wrap" style="margin:0 2%;border-radius:8px;overflow:hidden;border:1px solid var(--rule);">
    <table class="ptable">
      <thead>
        <tr>
          <th style="width:16%;padding-left:16px;">Partner · Product</th>
          <th style="border-left:2px solid rgba(255,255,255,0.3);">Target<br><span style="opacity:0.6;font-weight:400;">baskets</span></th>
          <th>Target<br><span style="opacity:0.6;font-weight:400;">₹ Lakhs</span></th>
          <th>Actual<br><span style="opacity:0.6;font-weight:400;">baskets</span></th>
          <th>Actual<br><span style="opacity:0.6;font-weight:400;">₹ Lakhs</span></th>
          <th>Achievement<br><span style="opacity:0.6;font-weight:400;">₹ Lakhs</span></th>
          <th style="border-left:2px solid rgba(255,255,255,0.3);">FY27 Visibility</th>
          <th>FY27 Achieved<br><span style="opacity:0.6;font-weight:400;">YTD</span></th>
          <th style="padding-right:16px;">Status</th>
        </tr>
      </thead>
      <tbody>
        ${tableRows}
        <tr style="background:var(--purple-pale);border-top:2px solid var(--purple);">
          <td style="padding-left:16px;border-top:2px solid var(--purple);">
            <div class="pname" style="color:var(--purple);">Total</div>
            <div class="pprod">All Partners</div>
          </td>
          <td style="border-left:2px solid var(--rule);border-top:2px solid var(--purple);font-weight:700;">${num(TOT.target_baskets)}</td>
          <td style="border-top:2px solid var(--purple);font-weight:700;">₹${TOT.target_rev_l}</td>
          <td style="border-top:2px solid var(--purple);font-weight:700;">${num(TOT.actual_baskets)}</td>
          <td style="border-top:2px solid var(--purple);font-weight:700;">₹${TOT.actual_rev_l}</td>
          <td style="border-top:2px solid var(--purple);">
            <div class="pbar-wrap">
              <span style="font-weight:800;color:var(--purple);font-size:12px;min-width:36px;">${Math.round(TOT.actual_rev_l / TOT.target_rev_l * 1000)/10}%</span>
              <div class="pbar"><div class="pbar-fill pf-purple" style="width:${Math.min(Math.round(TOT.actual_rev_l / TOT.target_rev_l * 1000)/10,100)}%"></div></div>
            </div>
          </td>
          <td style="border-left:2px solid var(--rule);border-top:2px solid var(--purple);font-weight:700;">—</td>
          <td style="border-top:2px solid var(--purple);">
            <div style="font-weight:600;color:var(--ink);font-size:11.5px;"><strong>${num(TOT.fy27_achieved_baskets)}</strong> · ₹${TOT.fy27_achieved_rev_l}L</div>
          </td>
          <td style="padding-right:16px;border-top:2px solid var(--purple);">—</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- PAGE 2 -->
  <div style="height:20px;background:var(--bg);"></div>
  <hr class="page-break">
  <div style="height:8px;background:var(--bg);"></div>

  <div style="background:#FFFFFF;padding:10px 2%;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--coral);flex-wrap:nowrap;gap:12px;">
    <div style="display:flex;align-items:center;gap:10px;flex-shrink:0;">
      ${logoImgSm}
      <span style="color:var(--ink);font-size:11px;font-weight:600;white-space:nowrap;">Partner Visibility &amp; Key Actions — ${m.month}</span>
    </div>
    <span style="color:var(--ink-muted);font-size:10px;letter-spacing:0.06em;white-space:nowrap;">Page 2 of 2 · Confidential</span>
  </div>







  <!-- FOOTER -->
  <div class="footer">
    <span class="highlight">${m.month}</span>
    <span>Confidential</span>
  </div>
  `;
}

// ── Boot ──
try {
  const raw = document.getElementById('DASHBOARD_DATA').textContent;
  const D   = JSON.parse(raw);
  render(D);
} catch(e) {
  document.getElementById('dashboard-root').innerHTML = 
    '<div style="padding:40px;font-family:monospace;color:red;background:#fff;">' +
    '<h2>Dashboard Error</h2><pre>' + e.stack + '</pre></div>';
}
</script>
</body>
</html></script>
</body>
</html>
